name: CI

on:
  push:
    branches: [main]
  pull_request:

# PRs empilhados geram muitas execucoes; cancela as superadas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analisar-e-testar:
    name: analyze e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versao fixa de proposito: `channel: stable` muda sob os pes e quebraria
      # a build sem ninguem ter mexido no codigo.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          cache: true

      - name: Baixar dependencias
        run: flutter pub get

      - name: Analise estatica
        run: flutter analyze

      # A bateria de integracao se auto-pula sem SUPABASE_INTEGRATION=1, entao
      # este passo roda apenas os testes offline, sem rede e sem credenciais.
      - name: Testes
        run: flutter test

  testes-integracao:
    name: integracao supabase
    needs: analisar-e-testar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          cache: true

      - name: Baixar dependencias
        run: flutter pub get

      - name: Testes de Integracao Supabase
        run: flutter test test/storage_integration_test.dart test/storage_server_authorization_test.dart
        env:
          SUPABASE_INTEGRATION: "1"
          ALUNO_A_EMAIL: ${{ secrets.ALUNO_A_EMAIL }}
          ALUNO_A_SENHA: ${{ secrets.ALUNO_A_SENHA }}
          ALUNO_B_EMAIL: ${{ secrets.ALUNO_B_EMAIL }}
          ALUNO_B_SENHA: ${{ secrets.ALUNO_B_SENHA }}
          COORD_EMAIL: ${{ secrets.COORD_EMAIL }}
          COORD_SENHA: ${{ secrets.COORD_SENHA }}
